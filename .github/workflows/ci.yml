name: Verify and deploy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Verify hook discovery in the supported Codex runtime
        run: |
          npm install --prefix .local/codex-host --no-save --ignore-scripts @openai/codex@0.161.0
          node scripts/check-codex-hooks.mjs
      - run: npm audit
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check this is still the newest main commit
        id: latest
        run: |
          git fetch origin main
          if [ "$GITHUB_SHA" = "$(git rev-parse origin/main)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.latest.outputs.current == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: steps.latest.outputs.current == 'true'
      - run: npm run build
        if: steps.latest.outputs.current == 'true'
      - name: Deploy to Cloudflare
        if: steps.latest.outputs.current == 'true'
        run: |
          npx wrangler d1 migrations apply AUTH_DB --remote
          npx wrangler deploy --var BUILD_SHA:$GITHUB_SHA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check the live website
        if: steps.latest.outputs.current == 'true'
        run: node scripts/check-deployment.mjs https://tinyagents.michael-325.workers.dev "$GITHUB_SHA"
